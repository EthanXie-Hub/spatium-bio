[project]
name = "spatium-bio"
version = "0.2.0"
description = "Core library for Spatium Bio — protein I/O, embeddings, and manifold operators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ethan Xie", email = "nyssa520ethan@gmail.com" }]
keywords = ["computational-biology", "protein", "embeddings", "structure"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "biopython>=1.84",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "requests>=2.31",
  "torch>=2.2",
  "transformers>=4.40",
]

[project.scripts]
spatium-bio = "spatium_bio.cli:main"

[project.urls]
Homepage = "https://github.com/EthanXie-Hub/spatium-bio"
Repository = "https://github.com/EthanXie-Hub/spatium-bio"
Issues = "https://github.com/EthanXie-Hub/spatium-bio/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatium_bio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: tests that need internet access (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# Greek letters (α, β, …) are standard biology notation; do not flag them.
ignore = ["RUF001", "RUF002", "RUF003"]
